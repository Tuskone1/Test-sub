name: Обновление тестовой подписки
on:
  workflow_dispatch:
  schedule:
    - cron: '17 * * * *'
  push:
    paths:
      - 'settings.json'
      - 'manual.json'
      - 'update.py'
      - '.github/workflows/update.yml'
permissions:
  contents: write
concurrency:
  group: smart-sub-update
  cancel-in-progress: false
jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - name: Install pinned Xray
        shell: bash
        run: |
          set -euo pipefail
          curl -fsSL --retry 3 -o xray.zip https://github.com/XTLS/Xray-core/releases/download/v26.10.31/Xray-linux-64.zip
          echo 'e4bd9119f50ae7c41658b1abd0679ae06f98bd864a2907ff33f2f2cf7081b214  xray.zip' | sha256sum -c -
          mkdir -p /tmp/xray-bin
          unzip -q xray.zip 'xray' 'geoip.dat' 'geosite.dat' -d /tmp/xray-bin
          chmod +x /tmp/xray-bin/xray
          echo '/tmp/xray-bin' >> "$GITHUB_PATH"
          echo 'XRAY_LOCATION_ASSET=/tmp/xray-bin' >> "$GITHUB_ENV"
          rm xray.zip
      - name: Build subscription
        run: python3 update.py
      - name: Publish results
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add output/subscription.json output/report.json
          if git diff --cached --quiet; then
            echo 'No changes'
          else
            git commit -m 'Update test subscription'
            git pull --rebase origin "${GITHUB_REF_NAME}"
            git push origin "HEAD:${GITHUB_REF_NAME}"
          fi
